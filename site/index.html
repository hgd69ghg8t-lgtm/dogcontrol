<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NZ Dog Control Statistics</title>
  <meta name="description" content="Interactive charts of the annual dog control statistics published by MCERT.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>NZ Dog Control Statistics</h1>
    <p class="lede">Charts of the annual dog control statistics that
      <a href="https://www.mcert.govt.nz/our-work/local-government/dog-control/dog-control-statistics/">MCERT publishes</a>
      from the National Dog Database.</p>
  </header>

  <main id="app">
    <section class="controls" aria-label="Chart controls">
      <label>Table
        <select id="dataset"></select>
      </label>
      <label>Measure
        <select id="measure"></select>
      </label>
      <label>Sort
        <select id="sort">
          <option value="desc">Highest first</option>
          <option value="asc">Lowest first</option>
          <option value="name">A–Z</option>
        </select>
      </label>
      <label class="grow">Filter
        <input id="search" type="search" placeholder="Filter rows, e.g. Auckland">
      </label>
    </section>

    <section class="tiles" id="tiles" aria-live="polite"></section>

    <section class="card">
      <div class="card-head">
        <h2 id="chart-title">Loading…</h2>
        <div class="view-toggle" role="tablist">
          <button type="button" role="tab" data-view="chart" aria-selected="true">Chart</button>
          <button type="button" role="tab" data-view="table" aria-selected="false">Table</button>
        </div>
      </div>
      <p id="notes" class="notes"></p>
      <div id="chart" class="chart"></div>
      <div id="table" class="table-wrap" hidden></div>
      <button type="button" id="more" class="more" hidden></button>
      <p id="footnotes" class="notes"></p>
    </section>

    <section id="empty" class="card empty" hidden>
      <h2>No data yet</h2>
      <p>Put the MCERT workbook (for example <code>Dog-control-statistics-Nov-2025.xlsx</code>)
        in <code>data/raw/</code> and run <code>python scripts/build_data.py</code>.</p>
    </section>
  </main>

  <footer class="page-footer">
    <p id="source"></p>
  </footer>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
